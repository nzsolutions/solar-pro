{% extends 'layouts/admin.html' %}

{% block content %}
<style>
    .section-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #F3F4F6;
        border: 1px solid #E5E7EB;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 0.85rem;
        font-weight: 500;
        color: #374151;
        max-width: 160px;
        cursor: default;
    }
    .section-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .section-pill .pill-close {
        background: none; border: none; padding: 0; color: #9CA3AF;
        cursor: pointer; font-size: 0.7rem; line-height: 1; flex-shrink: 0;
    }
    .section-pill .pill-close:hover { color: #DC2626; }
    #sectionList { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0.5rem; min-height: 36px; }

    .graph-card {
        background: #F9FAFB;
        border: 1px solid #E5E7EB;
        border-radius: 10px;
        padding: 1.1rem 1.25rem;
        position: relative;
        margin-bottom: 1rem;
    }
    .graph-card .remove-btn {
        position: absolute; top: 10px; right: 12px;
        background: none; border: none; color: #9CA3AF;
        font-size: 1.1rem; cursor: pointer;
    }
    .graph-card .remove-btn:hover { color: #DC2626; }
    .form-label.small { font-size: 0.8rem; color: #6B7280; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
</style>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Dashboard Configuration</h2>
    <button class="btn hover-lift px-4 shadow-sm" style="background-color: var(--accent-orange); color: white; font-weight: 600;" onclick="saveConfiguration()">
        <i class="bi bi-save"></i> Save Layout
    </button>
</div>

<!-- Section Master -->
<div class="card shadow-sm border-0 mb-4">
    <div class="card-body">
        <h5 class="fw-bold mb-3">Section Master</h5>
        <div class="d-flex align-items-center gap-2 mb-2">
            <input type="text" id="sectionName" class="form-control" placeholder="Enter section name" style="max-width: 400px;" onkeydown="if(event.key==='Enter'){event.preventDefault();addSection();}">
            <button type="button" class="btn btn-dark px-3" onclick="addSection()" title="Add Section">
                <i class="bi bi-plus-lg"></i>
            </button>
        </div>
        <div id="sectionError" class="text-danger small mb-1"></div>
        <div id="sectionList"></div>
    </div>
</div>

<!-- Graphs Config -->
<div class="card shadow-sm border-0 mb-4">
    <div class="card-body">
        <button class="btn btn-outline-dark mb-3" onclick="addGraph()">+ Add New Graph</button>
        <form id="configForm" method="POST" action="{% url 'admin_dashboard_config_save' %}">
            {% csrf_token %}
            <input type="hidden" name="config_json" id="config_json">
            <div id="graphsContainer"></div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
(function() {
    let graphs = {{ savedConfig|safe }};
    let sections = {{ sections|safe }};
    const forms = [
        {% for f in forms %}
            { id: {{ f.id }}, form_name: "{{ f.form_name|escapejs }}" },
        {% endfor %}
    ];
    const csrfToken = '{{ csrf_token }}';

    // ── Section Master ────────────────────────────────────────────────────────
    function renderSections() {
        const list = document.getElementById('sectionList');
        list.innerHTML = '';
        if (!sections.length) {
            list.innerHTML = '<span class="text-muted small">No sections yet. Add one above.</span>';
            return;
        }
        sections.forEach(s => {
            const pill = document.createElement('div');
            pill.className = 'section-pill';
            pill.title = s.section_name;
            pill.innerHTML = `<span>${escHtml(s.section_name)}</span>
                <button class="pill-close" onclick="deleteSection(${s.id})" title="Delete">
                    <i class="bi bi-x-lg"></i>
                </button>`;
            list.appendChild(pill);
        });
    }

    async function addSection() {
        const input = document.getElementById('sectionName');
        const errBox = document.getElementById('sectionError');
        errBox.textContent = '';
        const name = input.value.trim();
        if (!name) { errBox.textContent = 'Please enter a section name.'; return; }

        try {
            const res = await fetch('/dashboard/section/store', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ section_name: name })
            });
            const data = await res.json();
            if (!res.ok || !data.success) { errBox.textContent = data.message || 'Could not add section.'; return; }
            sections.push(data.section);
            input.value = '';
            renderSections();
            renderGraphs();
        } catch(e) { errBox.textContent = 'Something went wrong, try again.'; }
    }

    async function deleteSection(id) {
        if (!confirm('Delete this section? Graphs assigned to it will move to "Other".')) return;
        const errBox = document.getElementById('sectionError');
        errBox.textContent = '';
        try {
            const res = await fetch(`/dashboard/section/${id}/delete`, {
                method: 'DELETE',
                headers: { 'X-CSRFToken': csrfToken }
            });
            const data = await res.json();
            if (!res.ok || !data.success) { errBox.textContent = 'Could not delete section.'; return; }
            sections = sections.filter(s => s.id !== id);
            renderSections();
            renderGraphs();
        } catch(e) { errBox.textContent = 'Something went wrong, try again.'; }
    }

    // ── Graphs ────────────────────────────────────────────────────────────────
    function escHtml(str) {
        const d = document.createElement('div'); d.appendChild(document.createTextNode(str || '')); return d.innerHTML;
    }

    function renderGraphs() {
        const container = document.getElementById('graphsContainer');
        container.innerHTML = '';

        graphs.forEach((graph, index) => {
            const formOptions = forms.map(f =>
                `<option value="${f.id}" ${f.id == graph.form_id ? 'selected' : ''}>${escHtml(f.form_name)}</option>`
            ).join('');

            const sectionOptions = sections.map(s =>
                `<option value="${s.id}" ${s.id == graph.section_id ? 'selected' : ''}>${escHtml(s.section_name)}</option>`
            ).join('');

            const chartTypes = [
                {v:'bar',   l:'Bar Chart'},
                {v:'line',  l:'Line Chart (Trend)'},
                {v:'pie',   l:'Pie Chart'},
            ].map(t => `<option value="${t.v}" ${graph.type == t.v ? 'selected':''}>${t.l}</option>`).join('');

            const widths = [
                {v:'4',l:'33%'},{v:'6',l:'50%'},{v:'12',l:'100%'}
            ].map(w => `<option value="${w.v}" ${graph.size == w.v ? 'selected':''}>${w.l}</option>`).join('');

            const card = document.createElement('div');
            card.className = 'graph-card';
            card.innerHTML = `
                <button type="button" class="remove-btn" onclick="removeGraph(${index})" title="Remove">
                    <i class="bi bi-x-lg"></i>
                </button>
                <div class="row g-3 align-items-end">
                    <div class="col-md-2">
                        <label class="form-label small">Select Section</label>
                        <select class="form-select form-select-sm" onchange="updateGraph(${index},'section_id',this.value)">
                            <option value="">Select Section…</option>
                            ${sectionOptions}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Graph Title</label>
                        <input type="text" class="form-control form-control-sm" value="${escHtml(graph.title || '')}"
                            oninput="updateGraph(${index},'title',this.value)">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Select Form</label>
                        <select class="form-select form-select-sm"
                            onchange="loadFields(this.value,${index}); updateGraph(${index},'form_id',this.value)">
                            <option value="">Choose Form…</option>
                            ${formOptions}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Data Point (Y-Axis)</label>
                        <select class="form-select form-select-sm" id="fieldSelect_${index}"
                            onchange="updateGraph(${index},'field',this.value)">
                            <option value="${graph.field || ''}">${graph.field ? 'Loaded…' : 'Select Form First'}</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label small">Color</label>
                        <input type="color" class="form-control form-control-color w-100 form-control-sm"
                            value="${graph.color || '#F59E0B'}"
                            oninput="updateGraph(${index},'color',this.value)">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Chart Type</label>
                        <select class="form-select form-select-sm" onchange="updateGraph(${index},'type',this.value)">
                            ${chartTypes}
                        </select>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label small">Width</label>
                        <select class="form-select form-select-sm" onchange="updateGraph(${index},'size',this.value)">
                            ${widths}
                        </select>
                    </div>
                </div>`;
            container.appendChild(card);

            if (graph.form_id) loadFields(graph.form_id, index, graph.field);
        });
    }

    function addGraph() {
        graphs.push({ section_id: '', title: '', form_id: '', field: '', color: '#F59E0B', type: 'bar', size: '6' });
        renderGraphs();
    }

    function removeGraph(index) {
        graphs.splice(index, 1);
        renderGraphs();
    }

    function updateGraph(index, key, value) {
        graphs[index][key] = value;
    }

    async function loadFields(formId, index, selectedField) {
        if (!formId) return;
        try {
            const res = await fetch(`/admin/config/fields/${formId}`);
            const fields = await res.json();
            const select = document.getElementById(`fieldSelect_${index}`);
            if (!select) return;
            select.innerHTML = '<option value="">Select Target Field…</option>' +
                fields.map(f => `<option value="${f.id}" ${f.id === selectedField ? 'selected' : ''}>${escHtml(f.label)}</option>`).join('');
        } catch(e) {}
    }

    function saveConfiguration() {
        document.getElementById('config_json').value = JSON.stringify(graphs);
        document.getElementById('configForm').submit();
    }

    // Expose globals used by inline onclick
    window.addSection = addSection;
    window.deleteSection = deleteSection;
    window.addGraph = addGraph;
    window.removeGraph = removeGraph;
    window.updateGraph = updateGraph;
    window.loadFields = loadFields;
    window.saveConfiguration = saveConfiguration;

    renderSections();
    renderGraphs();
})();
</script>
{% endblock %}
