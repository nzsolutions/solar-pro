    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Global SweetAlert2 flash message trigger. Reads session('success') / session('error')
         set by any controller redirect — no per-page markup required. -->
    {% if session('success' %} || session('error'))
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                Swal.fire({
                    icon: '{{ session('success') ? 'success' : 'error' }}',
                    title: '{{ session('success') ? 'Success' : 'Something went wrong' }}',
                    text: @json(session('success') ?? session('error')),
                    confirmButtonColor: '#FF9F1C',
                    confirmButtonText: 'OK',
                    timer: 3500,
                    timerProgressBar: true,
                    showClass: {
                        popup: 'swal2-noanimation'
                    },
                    customClass: {
                        popup: 'rounded-4'
                    }
                });
            });
        </script>
    {% endif %}

    @stack('scripts')
</body>
</html>
